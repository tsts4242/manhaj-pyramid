<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منهج الصلاح والفوز</title>
    <link rel="stylesheet" href="style.css?v=30">
</head>
<body>
<div class="container">
    <div class="header-card">
        <h1>منهج الصلاح والفوز</h1>
        <p class="subtitle">لتعرية الباطل وفهم الدين</p>
        <p class="tagline">من القاعدة للقمة</p>
        <div class="author-badge">تصميم: صلاح الدين فوزي بن تعاريت</div>
    </div>

    <button type="button" class="pyramid-btn" onclick="togglePyramid(1)">
        <span>الهرم البحثي المتدرج</span>
    </button>
    <div class="pyramid-container" id="pyramid-box-1" style="display:none;">
        <img src="pyramid1.png" alt="منهج هرم الصلاح والفوز">
        <div class="pyramid-note-box">يسهل ويسرع الوصول للمعلومة بضغطة زر</div>
        <button type="button" class="pyramid-back-btn" onclick="returnToMain()">العودة</button>
    </div>

    <button type="button" class="pyramid-btn pyramid-btn-en" dir="ltr" onclick="togglePyramid(2)">
        <span>Asalah and Fawz Pyramid</span>
    </button>
    <div class="pyramid-container" id="pyramid-box-2" style="display:none;">
        <img src="pyramid2.png" alt="Asalah and Fawz Pyramid">
        <div class="pyramid-note-box" dir="ltr">Facilitating the Understanding of Religion</div>
        <button type="button" class="pyramid-back-btn" onclick="returnToMain()">العودة</button>
    </div>

    <div class="search-card">
        <input type="text" id="quran-word" class="search-input" placeholder="اكتب هنا اللفظ المراد تدبره" onkeypress="if(event.key==='Enter') startContemplation()">
        <div class="actions">
            <button type="button" class="btn-submit" id="submit-btn" onclick="startContemplation()">ابدأ التدبر</button>
            <button type="button" class="btn-clear" onclick="clearInput()">فسخ</button>
            <button type="button" class="btn-listen" id="listen-btn" onclick="toggleListen()">الاستماع</button>
        </div>
        <div class="levels-bar" id="levelsBar">
            <button type="button" class="level-btn" onclick="selectLevel(1)">1</button>
            <button type="button" class="level-btn" onclick="selectLevel(2)">2</button>
            <button type="button" class="level-btn" onclick="selectLevel(3)">3</button>
            <button type="button" class="level-btn" onclick="selectLevel(4)">4</button>
            <button type="button" class="level-btn" onclick="selectLevel(5)">5</button>
            <button type="button" class="level-btn" onclick="selectLevel(6)">6</button>
        </div>
    </div>

    <div class="loader" id="loader" style="display:none;">
        <div class="loader-single-line">جاري التدبر بحسب المستويات</div>
        <div class="spinner"></div>
    </div>

    <div class="results-wrapper" id="results-wrapper" style="display:none;">
        <div class="level-card" id="card-1"><div class="level-header">المستوى الأول</div><div class="level-body" id="content-1"></div></div>
        <div class="level-card" id="card-2"><div class="level-header">المستوى الثاني</div><div class="level-body" id="content-2"></div></div>
        <div class="level-card" id="card-3"><div class="level-header">المستوى الثالث</div><div class="level-body" id="content-3"></div></div>
        <div class="level-card" id="card-4"><div class="level-header">المستوى الرابع</div><div class="level-body" id="content-4"></div></div>
        <div class="level-card" id="card-5"><div class="level-header">المستوى الخامس</div><div class="level-body" id="content-5"></div></div>
        <div class="level-card" id="card-6"><div class="level-header">المستوى السادس</div><div class="level-body" id="content-6"></div></div>
    </div>
</div>
<script src="app.js?v=30"></script>
</body>
</html>
