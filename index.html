<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منهج الصلاح والفوز - لتعرية الباطل وفهم الدين</title>
    <link rel="stylesheet" href="style.css?v=50">
</head>
<body>
<div class="container">
    <div class="header-card">
        <h1>منهج الصلاح والفوز</h1>
        <p class="subtitle">لتعرية الباطل وفهم الدين</p>
        <p class="tagline">من القاعدة للقمة</p>
        <div class="author-badge">تصميم: صلاح الدين فوزي بن تعاريت</div>
    </div>

    <button type="button" class="pyramid-btn" id="btn-pyr-1">
        <span>الهرم البحثي المتدرج للتدبر</span>
    </button>
    <div class="pyramid-container" id="pyramid-box-1" style="display:none;">
        <img src="pyramid1.png" alt="منهج هرم الصلاح والفوز">
        <div class="pyramid-note-box">يسهل ويسرع الوصول للمعلومة بضغطة زر</div>
        <button type="button" class="pyramid-back-btn" id="btn-back-1">العودة</button>
    </div>

    <button type="button" class="pyramid-btn pyramid-btn-articles" id="btn-articles">
        <span>مقالات وأبحاث</span>
    </button>
    <div class="articles-container" id="articles-box" style="display:none;">
        <div class="articles-grid" id="articles-grid"></div>
        <div class="article-viewer" id="article-viewer" style="display:none;">
            <h3 class="article-title" id="article-title"></h3>
            <div class="article-body" id="article-body"></div>
        </div>
        <button type="button" class="pyramid-back-btn" id="btn-back-articles" style="margin-top:12px;">العودة</button>
    </div>

    <button type="button" class="pyramid-btn pyramid-btn-en" dir="ltr" id="btn-pyr-2">
        <span>Asalah wal Fawz Pyramid</span>
    </button>
    <div class="pyramid-container" id="pyramid-box-2" style="display:none;">
        <img src="pyramid2.png" alt="Asalah and Fawz Pyramid">
        <div class="pyramid-note-box" dir="ltr">Facilitating the Understanding of Religion</div>
        <button type="button" class="pyramid-back-btn" id="btn-back-2">العودة</button>
    </div>

    <div class="search-card">
        <input type="text" id="quran-word" class="search-input" placeholder="اكتب هنا اللفظ المراد تدبره">
        <div class="actions">
            <button type="button" class="btn-submit" id="submit-btn">ابدأ البحث</button>
            <button type="button" class="btn-clear" id="clear-btn">فسخ</button>
            <button type="button" class="btn-listen" id="listen-btn">استماع</button>
        </div>
        <div class="levels-bar" id="levelsBar">
            <button type="button" class="level-btn" data-lvl="1">1</button>
            <button type="button" class="level-btn" data-lvl="2">2</button>
            <button type="button" class="level-btn" data-lvl="3">3</button>
            <button type="button" class="level-btn" data-lvl="4">4</button>
            <button type="button" class="level-btn" data-lvl="5">5</button>
            <button type="button" class="level-btn" data-lvl="6">6</button>
        </div>
    </div>

    <div class="loader" id="loader" style="display:none;">
        <div class="loader-single-line" id="loader-text">جاري البحث بحسب المستويات</div>
        <div class="spinner"></div>
    </div>

    <div class="results-wrapper" id="results-wrapper" style="display:none;">
        <div class="level-card" id="card-1"><div class="level-header">المستوى الأول</div><div class="level-body" id="content-1"></div></div>
        <div class="level-card" id="card-2"><div class="level-header">المستوى الثاني</div><div class="level-body" id="content-2"></div></div>
        <div class="level-card" id="card-3"><div class="level-header">المستوى الثالث</div><div class="level-body" id="content-3"></div></div>
        <div class="level-card" id="card-4"><div class="level-header">المستوى الرابع</div><div class="level-body" id="content-4"></div></div>
        <div class="level-card" id="card-5"><div class="level-header">المستوى الخامس</div><div class="level-body" id="content-5"></div></div>
        <div class="level-card" id="card-6"><div class="level-header">المستوى السادس</div><div class="level-body" id="content-6"></div></div>
    </div>
</div>
<script src="articles.js?v=50"></script>
<script src="app.js?v=50"></script>
</body>
</html>
