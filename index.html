<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منهج الصلاح والفوز - لتعرية الباطل وفهم الدين</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيق زر الهرم الثاني المتناسق مع هوية الموقع */
        .pyramid-btn-en {
            background-color: #064e3b;
            border: 2px solid #c59b27;
            color: #ffffff;
            margin-top: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 0.5px;
            justify-content: center;
        }
        .pyramid-btn-en:hover {
            background-color: #04392b;
        }

        /* توسيط نص الزر الأول بعد حذف المثلث */
        .pyramid-btn {
            justify-content: center;
        }

        /* تنسيق شريط الأزرار الذهبية الستة أسفل ابدأ التدبر وفسخ */
        .levels-bar {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 14px;
            direction: rtl;
        }
        .level-btn {
            flex: 1;
            padding: 10px 0;
            border: 2px solid #c59b27;
            background-color: #ffffff;
            color: #0d2b52;
            font-weight: bold;
            font-size: 17px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .level-btn:hover {
            background-color: #fdf8e8;
        }
        .level-btn.active {
            background-color: #c59b27;
            color: #0d2b52;
            box-shadow: 0 3px 8px rgba(197, 155, 39, 0.4);
            transform: translateY(-2px);
        }

        /* إظهار بطاقة المستوى المختار فقط */
        .level-card {
            display: none;
        }
        .level-card.active-card {
            display: block;
        }

        /* تنسيق نص التحميل في سطر واحد والدائرة المتحركة تحته */
        .loader {
            display: none;
            margin: 20px 0;
        }
        .loader-single-line {
            white-space: nowrap;
            font-size: clamp(13px, 3.8vw, 17px);
            font-weight: bold;
            color: #0d2b52;
            margin-bottom: 12px;
            text-align: center;
        }
        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #e6e9ef;
            border-top: 4px solid #c59b27;
            border-bottom: 4px solid #0d2b52;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-card">
        <h1>منهج الصلاح والفوز</h1>
        <p class="subtitle">لتعرية الباطل وفهم الدين</p>
        <p class="tagline">من القاعدة للقمة</p>
        <div class="author-badge">تصميم: صلاح الدين فوزي بن تعاريت</div>
    </div>

    <!-- الزر الأول: الهرم البحثي المتدرج -->
    <button type="button" class="pyramid-btn" onclick="togglePyramid(1)">
        <span>الهرم البحثي المتدرج</span>
    </button>

    <!-- حاوية الصورة الأولى -->
    <div class="pyramid-container" id="pyramid-box-1" style="display: none;">
        <img src="pyramid1.png" alt="منهج هرم الصلاح والفوز">
        <div class="pyramid-note-box">يسهل ويسرع الوصول للمعلومة بضغطة زر</div>
        <button type="button" class="pyramid-back-btn" onclick="returnToMain()">العودة</button>
    </div>

    <!-- الزر الثاني: Asalah and Fawz Pyramid -->
    <button type="button" class="pyramid-btn pyramid-btn-en" dir="ltr" onclick="togglePyramid(2)">
        <span>Asalah and Fawz Pyramid</span>
    </button>

    <!-- حاوية الصورة الثانية -->
    <div class="pyramid-container" id="pyramid-box-2" style="display: none;">
        <img src="pyramid2.png" alt="Asalah and Fawz Pyramid">
        <div class="pyramid-note-box" dir="ltr">Facilitating the Understanding of Religion</div>
        <button type="button" class="pyramid-back-btn" onclick="returnToMain()">العودة</button>
    </div>

    <!-- بطاقة البحث والمستويات -->
    <div class="search-card">
        <input type="text" id="quran-word" class="search-input" placeholder="اكتب هنا اللفظ المراد تدبره" onkeypress="if(event.key==='Enter') startContemplation()">
        
        <div class="actions">
            <button type="button" class="btn-submit" id="submit-btn" onclick="startContemplation()">ابدأ التدبر</button>
            <button type="button" class="btn-clear" onclick="clearInput()">فسخ</button>
        </div>

        <!-- شريط الأزرار الذهبية الستة أسفل ابدأ التدبر وفسخ -->
        <div class="levels-bar" id="levelsBar">
            <button type="button" class="level-btn" id="btn-lvl-1" onclick="selectLevel(1)">1</button>
            <button type="button" class="level-btn" id="btn-lvl-2" onclick="selectLevel(2)">2</button>
            <button type="button" class="level-btn" id="btn-lvl-3" onclick="selectLevel(3)">3</button>
            <button type="button" class="level-btn" id="btn-lvl-4" onclick="selectLevel(4)">4</button>
            <button type="button" class="level-btn" id="btn-lvl-5" onclick="selectLevel(5)">5</button>
            <button type="button" class="level-btn" id="btn-lvl-6" onclick="selectLevel(6)">6</button>
        </div>
    </div>

    <!-- مؤشر التحميل: سطر واحد وتحته الدائرة المتحركة -->
    <div class="loader" id="loader">
        <div class="loader-single-line">جاري التدبر بحسب المستويات</div>
        <div class="spinner"></div>
    </div>

    <!-- حاوية نتائج المستويات -->
    <div class="results-wrapper" id="results-wrapper">
        <div class="level-card" id="card-1"><div class="level-header">المستوى الأول</div><div class="level-body" id="content-1"></div></div>
        <div class="level-card" id="card-2"><div class="level-header">المستوى الثاني</div><div class="level-body" id="content-2"></div></div>
        <div class="level-card" id="card-3"><div class="level-header">المستوى الثالث</div><div class="level-body" id="content-3"></div></div>
        <div class="level-card" id="card-4"><div class="level-header">المستوى الرابع</div><div class="level-body" id="content-4"></div></div>
        <div class="level-card" id="card-5"><div class="level-header">المستوى الخامس</div><div class="level-body" id="content-5"></div></div>
        <div class="level-card" id="card-6"><div class="level-header">المستوى السادس</div><div class="level-body" id="content-6"></div></div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
